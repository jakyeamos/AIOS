name: aios-ui-quality

on:
  push:
    paths:
      - "aios-ui/**"
      - "config/architecture-enforcement/**"
      - ".github/workflows/aios-ui-quality.yml"
  pull_request:
    paths:
      - "aios-ui/**"
      - "config/architecture-enforcement/**"
      - ".github/workflows/aios-ui-quality.yml"

jobs:
  lint-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "aios-ui/pnpm-lock.yaml"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install aios-ui dependencies
        run: pnpm --dir aios-ui install --frozen-lockfile

      - name: ESLint + TypeScript
        run: pnpm --dir aios-ui lint

      - name: ESLint Warning Baseline
        run: pnpm --dir aios-ui lint:warning-baseline

      - name: Architecture Boundaries
        run: pnpm --dir aios-ui lint:architecture

      - name: Anti-Slop Fixture Checks
        run: pnpm --dir aios-ui lint:anti-slop:fixtures

      - name: Production Build
        run: pnpm --dir aios-ui build
