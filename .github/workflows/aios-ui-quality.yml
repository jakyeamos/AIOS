name: aios-ui-quality

on:
  push:
    paths:
      - "aios-ui/**"
      - "config/architecture-enforcement/**"
      - ".github/workflows/aios-ui-quality.yml"
  pull_request:
    paths:
      - "aios-ui/**"
      - "config/architecture-enforcement/**"
      - ".github/workflows/aios-ui-quality.yml"

jobs:
  lint-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "aios-ui/package-lock.json"

      - name: Install aios-ui dependencies
        run: npm ci --prefix aios-ui

      - name: ESLint + TypeScript
        run: npm --prefix aios-ui run lint

      - name: Architecture Boundaries
        run: npm --prefix aios-ui run lint:architecture

      - name: Anti-Slop Fixture Checks
        run: npm --prefix aios-ui run lint:anti-slop:fixtures
